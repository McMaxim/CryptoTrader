name: CryptoTrader
options:
  bundleIdPrefix: com.demo
  developmentLanguage: ru
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  CryptoTrader:
    type: application
    platform: iOS
    sources:
      - CryptoTrader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.demo.CryptoTrader
        PRODUCT_NAME: CryptoTrader
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CryptoTrader
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  CryptoTraderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CryptoTraderTests
    dependencies:
      - target: CryptoTrader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.demo.CryptoTraderTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CryptoTrader:
    build:
      targets:
        CryptoTrader: all
        CryptoTraderTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CryptoTraderTests
